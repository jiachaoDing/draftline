<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">Draftline — AI Drawing Studio</title>
  <desc id="description">Turn sketches and measurements into editable SVG drawings. A dimensioned plate illustrates the drawing workspace.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101e39"/>
      <stop offset="1" stop-color="#071022"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4d76b8" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#background)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <g transform="translate(64 54)">
    <rect width="54" height="54" rx="15" fill="#215cf3"/>
    <g transform="scale(1.35)">
      <path d="M10 29V11h9c8 0 13 9 8 15-2 3-6 3-9 3" fill="none" stroke="white" stroke-width="3"/>
      <path d="m10 29 13-13" stroke="white" stroke-width="2"/>
    </g>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="134" y="94" fill="#fff" font-size="40" font-weight="750" letter-spacing="-1.5">draftline<tspan fill="#628dff">.</tspan></text>
    <text x="64" y="162" fill="#90b0ff" font-size="13" font-weight="650" letter-spacing="3">AI DRAWING STUDIO</text>
    <text x="61" y="229" fill="#fff" font-size="46" font-weight="700" letter-spacing="-1.6">From sketch to editable SVG.</text>
    <text x="64" y="271" fill="#aebed9" font-size="20">Your measurements. Your model. Your drawing.</text>
    <g fill="#dbe6ff" font-size="14">
      <rect x="64" y="310" width="145" height="35" rx="17.5" fill="#1b3053"/>
      <text x="83" y="333">Millimeter scale</text>
      <rect x="220" y="310" width="137" height="35" rx="17.5" fill="#1b3053"/>
      <text x="240" y="333">Targeted edits</text>
      <rect x="368" y="310" width="150" height="35" rx="17.5" fill="#1b3053"/>
      <text x="388" y="333">SVG export</text>
    </g>
    <text x="64" y="418" fill="#7f98bd" font-size="15" letter-spacing=".3">DESCRIBE  /  GENERATE  /  REFINE  /  EXPORT</text>
    <rect x="836" y="74" width="376" height="332" rx="18" fill="#10213a" stroke="#284369"/>
    <text x="863" y="108" fill="#8eaad1" font-size="12" letter-spacing="1.7">DRAWING.svg</text>
    <circle cx="1181" cy="104" r="4" fill="#78d5b3"/>
    <g fill="none" stroke="#7ca8ff" stroke-width="2">
      <rect x="905" y="173" width="237" height="158" rx="20" fill="#172e51"/>
      <circle cx="934" cy="202" r="9"/><circle cx="1113" cy="202" r="9"/>
      <circle cx="934" cy="302" r="9"/><circle cx="1113" cy="302" r="9"/>
    </g>
    <g fill="none" stroke="#597aab" stroke-width="1">
      <path d="M905 157V132M1142 157V132M905 141H1142M910 136l-10 10M1147 136l-10 10"/>
      <path d="M1157 173H1182M1157 331H1182M1173 173V331M1168 178l10-10M1168 336l10-10"/>
      <path d="M891 252H1156M1023.5 159V345" stroke-dasharray="5 5" opacity=".5"/>
    </g>
    <text x="1023" y="132" fill="#b7cdf1" font-size="14" text-anchor="middle">120 mm</text>
    <text x="1162" y="261" fill="#b7cdf1" font-size="13" text-anchor="middle" transform="rotate(-90 1162 261)">80 mm</text>
    <text x="863" y="379" fill="#7c9bc5" font-size="12">1 SVG unit = 1 mm</text>
    <text x="1185" y="379" fill="#7c9bc5" font-size="12" text-anchor="end">1:1</text>
  </g>
</svg>
